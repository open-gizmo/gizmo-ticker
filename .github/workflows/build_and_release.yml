name: Build & Release 📦

on:
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release 📦
    # Release only from main (the release goes live on the website flasher)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout repository
      - name: 🚚 Checkout repository
        uses: actions/checkout@v6

      # Set up Node.js
      - name: 🧰 Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # Install dependencies for webapp
      - name: 📦 Install webapp dependencies
        working-directory: webapp
        run: npm ci

      # Build the embedded assets for the webapp
      - name: 🏗️ Build embedded web assets
        working-directory: webapp
        run: npm run build:embedded

      # Set up Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install PlatformIO
      - name: ⚙️ Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.2.0
      
      # Download the firmware libraries (the webapp tests read the error IDs of gizmo-common)
      - name: 📥 Install firmware libraries
        working-directory: microcontroller
        run: pio pkg install -e esp32dev

      # Run the webapp tests
      - name: 🧪 Run webapp tests
        working-directory: webapp
        run: npm test

      # Run the native tests before building
      - name: 🧪 Run native tests
        working-directory: microcontroller
        run: pio test -e native

      # Build the ESP32 firmware
      - name: 🛠️ Build ESP32 Firmware
        working-directory: microcontroller
        run: pio run

      # Generate version code (es. v2023.09.15.1)
      - name: 🏷️ Generate version
        id: version
        run: |
          echo "DATE=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          echo "VERSION=v$(date +'%Y.%m.%d').${{ github.run_number }}" >> $GITHUB_OUTPUT

      # Package the flash parts (bootloader, partition table, boot_app0, app) and the manifest of the browser flasher
      - name: 🗂️ Package firmware
        run: python .github/scripts/package_firmware.py --project-dir microcontroller --name "Gizmo Ticker" --version "${{ steps.version.outputs.VERSION }}" --output-dir dist

      # Create a GitHub release with the flash parts
      - name: 📦 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            Automated build and release - ${{ steps.version.outputs.DATE }}

            Built from commit SHA: ${{ github.sha }}

            Flash it from the browser on https://opengizmo.dev/projects/gizmo-ticker, or over USB:

            ```bash
            esptool.py --chip esp32 write_flash 0x1000 bootloader.bin 0x8000 partitions.bin 0xe000 boot_app0.bin 0x10000 firmware.bin
            ```
          files: |
            dist/${{ steps.version.outputs.VERSION }}/*.bin
            microcontroller/.pio/build/esp32dev/firmware.elf
          draft: false
          prerelease: false

      # Upload the parts and the manifest to R2, where the website flasher downloads them (last, so the website only offers a released version)
      - name: ☁️ Upload firmware to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required # R2 refuses some checksums the AWS CLI sends by default
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # The parts of a version never change, so they can be cached for ever
          aws s3 cp "dist/$VERSION" "s3://$R2_BUCKET/gizmo-ticker/$VERSION" --recursive --endpoint-url "$R2_ENDPOINT" --cache-control "public, max-age=31536000, immutable" --content-type application/octet-stream

          # The manifest points the flasher to the new version, so it goes last and is cached for a minute only
          aws s3 cp dist/manifest.json "s3://$R2_BUCKET/gizmo-ticker/manifest.json" --endpoint-url "$R2_ENDPOINT" --cache-control "public, max-age=60" --content-type application/json
