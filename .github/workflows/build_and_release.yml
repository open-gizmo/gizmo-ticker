name: Build & Release 📦

on:
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release 📦
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout repository
      - name: 🚚 Checkout repository
        uses: actions/checkout@v6

      # Set up Node.js
      - name: 🧰 Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # Install dependencies for webapp
      - name: 📦 Install webapp dependencies
        working-directory: webapp
        run: npm ci

      # Build the embedded assets for the webapp
      - name: 🏗️ Build embedded web assets
        working-directory: webapp
        run: npm run build:embedded

      # Set up Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install PlatformIO
      - name: ⚙️ Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.2.0
      
      # Download the firmware libraries (the webapp tests read the error IDs of gizmo-common)
      - name: 📥 Install firmware libraries
        working-directory: microcontroller
        run: pio pkg install -e esp32dev

      # Run the webapp tests
      - name: 🧪 Run webapp tests
        working-directory: webapp
        run: npm test

      # Run the native tests before building
      - name: 🧪 Run native tests
        working-directory: microcontroller
        run: pio test -e native

      # Build the ESP32 firmware
      - name: 🛠️ Build ESP32 Firmware
        working-directory: microcontroller
        run: pio run

      # Check if the firmware build was successful
      - name: ✅ Check build output
        id: check
        run: |
          firmware_path=$(find microcontroller/.pio/build -path '*/firmware.bin' -print -quit)
          firmware_elf_path=$(find microcontroller/.pio/build -path '*/firmware.elf' -print -quit)

          if [ -n "$firmware_path" ]; then
            echo "FIRMWARE_EXISTS=true" >> $GITHUB_OUTPUT
            echo "FIRMWARE_PATH=$firmware_path" >> $GITHUB_OUTPUT
            echo "FIRMWARE_ELF_PATH=$firmware_elf_path" >> $GITHUB_OUTPUT
            echo "✅ Firmware build successful!"
            echo "Firmware: $firmware_path"
          else
            echo "FIRMWARE_EXISTS=false" >> $GITHUB_OUTPUT
            echo "❌ Firmware file not found! Build may have failed."
            exit 1
          fi

      # Generate version code (es. v2023.09.15.1)
      - name: 🏷️ Generate version
        id: version
        run: |
          echo "DATE=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          echo "VERSION=v$(date +'%Y.%m.%d').${{ github.run_number }}" >> $GITHUB_OUTPUT

      # Upload firmware to the deployed OpenGizmo website
      - name: 🚀 Upload firmware to OpenGizmo VPS
        if: steps.check.outputs.FIRMWARE_EXISTS == 'true'
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > id_rsa
          chmod 600 id_rsa
          ssh -i id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER }} "mkdir -p /var/www/open-gizmo/firmware/gizmo-ticker"
          rsync -az -e "ssh -i id_rsa -o StrictHostKeyChecking=no" "${{ steps.check.outputs.FIRMWARE_PATH }}" ${{ secrets.SSH_USER }}@${{ secrets.SERVER }}:/var/www/open-gizmo/firmware/gizmo-ticker/firmware.bin
          rm -f id_rsa

      # Create a GitHub release with the built firmware files
      - name: 📦 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            Automated build and release - ${{ steps.version.outputs.DATE }}
            
            Built from commit SHA: ${{ github.sha }}
          files: |
            ${{ steps.check.outputs.FIRMWARE_PATH }}
            ${{ steps.check.outputs.FIRMWARE_ELF_PATH }}
          draft: false
          prerelease: false