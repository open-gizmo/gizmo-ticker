name: Build & Release 📦

on:
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release 📦
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout repository
      - name: 🚚 Checkout repository
        uses: actions/checkout@v6

      # Set up Node.js
      - name: 🧰 Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # Install dependencies for webapp
      - name: 📦 Install webapp dependencies
        working-directory: webapp
        run: npm install

      # Build the embedded assets for the webapp
      - name: 🏗️ Build embedded web assets
        working-directory: webapp
        run: npm run build:embedded

      # Set up Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install PlatformIO
      - name: ⚙️ Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      
      # Build the ESP32 firmware
      - name: 🛠️ Build ESP32 Firmware
        working-directory: microcontroller
        run: pio run

      # Check if the firmware build was successful
      - name: ✅ Check build output
        id: check
        run: |
          if [ -f microcontroller/.pio/build/*/firmware.bin ]; then
            echo "FIRMWARE_EXISTS=true" >> $GITHUB_OUTPUT
            echo "✅ Firmware build successful!"
          else
            echo "FIRMWARE_EXISTS=false" >> $GITHUB_OUTPUT
            echo "❌ Firmware file not found! Build may have failed."
            exit 1
          fi

      # Generate version code (es. v2023.09.15.1)
      - name: 🏷️ Generate version
        id: version
        run: |
          echo "DATE=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          echo "VERSION=v$(date +'%Y.%m.%d').${{ github.run_number }}" >> $GITHUB_OUTPUT

      # Create a GitHub release with the built firmware files
      - name: 📦 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            Automated build and release - ${{ steps.version.outputs.DATE }}
            
            Built from commit SHA: ${{ github.sha }}
          files: |
            microcontroller/.pio/build/*/firmware.bin
            microcontroller/.pio/build/*/firmware.elf
          draft: false
          prerelease: false