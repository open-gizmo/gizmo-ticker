[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_src_flags = -Wformat ; Check printf-style format strings against their arguments in our own code
monitor_speed = 115200
lib_deps = 
	majicdesigns/MD_Parola@3.7.5
	majicdesigns/MD_MAX72XX@3.5.1
	ottowinter/ESPAsyncWebServer-esphome@3.4.0
	esphome/AsyncTCP-esphome@2.1.4
	bblanchon/ArduinoJson@7.2.2
	bblanchon/StreamUtils@1.9.2
	https://github.com/open-gizmo/gizmo-common.git#19aa4b5169c39b217ee3d6d4f11e9d75d879d19f ; v1.0.0 (switch to #v1.0.0 once the tag exists)

; Host tests for the hardware-free logic (run with: pio test -e native)
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<eeprom/config_json.cpp>
build_flags =
	-std=gnu++17
lib_deps =
	throwtheswitch/Unity@2.6.1
	bblanchon/ArduinoJson@7.2.2
